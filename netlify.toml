[build]
  publish   = "public"
  command   = "node scripts/build-config.mjs"
  functions = "netlify/functions"

# The build writes these values into public/js/config.js on purpose: the
# Supabase URL, the anon/publishable key and the VAPID public key are designed
# to be shipped to the browser. Tell Netlify's secrets scanner not to fail the
# build when it finds them. Real secrets (service_role key, VAPID private key)
# are still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,VAPID_PUBLIC_KEY"

[functions]
  node_bundler = "esbuild"

# Always fetch a fresh service worker and config
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self)"
