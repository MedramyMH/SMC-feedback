<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SMC Maintenance</title>
  <meta name="description" content="Share SMC maintenance interventions with the team">
  <meta name="theme-color" content="#14161a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMC Log">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Sign-in (Supabase mode only) -->
  <main id="auth" hidden></main>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></span>
        <div><b>SMC Maintenance</b><small>Team intervention log</small></div>
      </div>
      <span id="conn" class="conn" title=""></span>
      <button id="user-btn" class="avatar" aria-label="Settings">?</button>
    </header>

    <div class="container">
      <section id="view-ongoing" class="view"></section>
      <section id="view-history" class="view" hidden></section>
      <section id="view-stats" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </div>

    <nav class="tabbar">
      <button class="tab on" data-view="ongoing">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
        <span>Ongoing</span><i id="open-badge" class="badge" hidden>0</i>
      </button>
      <button class="tab" data-view="history">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>History</span>
      </button>
      <button id="capture-btn" class="capture" aria-label="Take a photo and start an intervention">
        <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg>
      </button>
      <button class="tab" data-view="stats">
        <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
        <span>Stats</span>
      </button>
      <button class="tab" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <!-- the quick-capture camera (opened by the yellow button) -->
  <input id="quick-cam" type="file" accept="image/*" capture="environment" hidden>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
